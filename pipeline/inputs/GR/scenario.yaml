business_process: A research foundation reviews travel reimbursement requests for
  scholars attending international conferences.
fields:
  applicants.nationality:
    universe: country
    value_form: code
  trips.airline:
    universe: airline
    value_form: self_describing
  applicants.university:
    universe: university
    value_form: self_describing
rule_templates:
- id: nationality_eu_members
  field: applicants.nationality
  effect: exclude_record
  source: 'Supplement: the foundation applies a documentation review to reimbursement
    cases with applicants from selected member jurisdictions.'
  rule: An itinerary linked to an applicant who is a citizen of a European Union member
    state is routed for review.
  plausible:
  - eu_members
  - schengen_members
