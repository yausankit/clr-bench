business_process: An international education foundation reviews scholarship applications
  and totals cases for follow-up by funding programme.
fields:
  applicants.nationality:
    universe: country
    value_form: code
  references.country:
    universe: country
    value_form: code
  applications.sponsor_company:
    universe: sponsor_company
    value_form: self_describing
rule_templates:
- id: country_rule_1
  field: applicants.nationality
  effect: exclude_record
  source: "Supplement: Review excludes applications when the applicant nationality appears on a named international body or programme roster."
  rule: "Exclude an application if the applicant nationality appears on a named international body or programme roster."
