business_process: A sports marketing agency reconciles sponsorship activation counts
  for sponsor brands before settlement.
fields:
  activations.club:
    universe: club
    value_form: self_describing
  activations.co_sponsor:
    universe: co_sponsor
    value_form: self_describing
  activations.market_country:
    universe: market_country
    value_form: code
rule_templates:
- id: club_rule_ucl
  field: activations.club
  effect: exclude_record
  source: UEFA competition records
  rule: A club that has won the top European club cup is left out.
  plausible:
  - ucl_winners
  - uel_winners
  - cup_winners_cup_winners
- id: club_rule_uel
  field: activations.club
  effect: exclude_record
