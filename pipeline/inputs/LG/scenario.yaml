business_process: A corporate network gateway aggregates the proxied connections and
  SSH logins of its workstations into one event count per workstation.
fields:
  proxy_connections.tld:
    universe: tld
    value_form: code
  proxy_connections.port:
    universe: port
    value_form: code
  proxy_connections.client_app:
    universe: client_app
    value_form: self_describing
  ssh_logins.user:
    universe: user
    value_form: self_describing
rule_templates:
- id: tld_eu
  field: proxy_connections.tld
  effect: exclude_record
  source: 'Supplement: the European Union lists its member states.'
  rule: A proxy connection to a target host under a country-code top-level domain
    of a European Union member state is not counted.
  plausible:
  - eu_member_cctlds
  - schengen_cctlds
  - eurozone_cctlds
  - nato_cctlds
